<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flashcard Yod olish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="title">📚 Flashcards</div>
            <div class="subtitle">Memorizing words is easy!</div>
        </div>

        <!-- FOLDER MANAGER MODE -->
        <div id="folderMode" class="mode-section active">
            <div class="folder-header">
                <button id="newFolderBtn" class="button folder-button">📁 + New file</button>
                <button id="backToMainBtn" class="button back-button">◀ Main</button>
            </div>
            <div class="folders-grid" id="foldersGrid"></div>
        </div>

        <!-- MANAGE MODE (kartalar bilan ishlash) -->
        <div id="manageMode" class="mode-section">
            <div class="manage-header">
                <button id="backToFoldersBtn" class="button back-button">◀ Back</button>
                <button id="saveFolderBtn" class="button save-button">💾 Save</button>
                <span id="currentFolderName" class="folder-name"></span>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="filledCount">0</div>
                    <div class="stat-label">Filled</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="emptyCount">50</div>
                    <div class="stat-label">Empty</div>
                </div>
            </div>

            <div class="add-card-section">
                <h2 class="section-title">Add a New Card</h2>
                <input type="text" id="frontInput" placeholder="Word" class="input">
                <input type="text" id="backInput" placeholder="Translation" class="input">
                <button id="addCardBtn" class="button add-button">➕ Add</button>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>

            <button id="startButton" class="button start-button">▶️ Start Learning</button>
        </div>

        <!-- STUDY MODE -->
        <div id="studyMode" class="mode-section">
            <div class="study-header">
                <div class="progress-counter" id="progressCounter">1 / 50</div>
                <button id="exitBtn" class="button exit-button">✕</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div class="flashcard-content" id="flashcardFront">Word</div>
                        <div class="flip-hint">Backp</div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div class="flashcard-content" id="flashcardBack">Translate</div>
                        <div class="flip-hint">Front</div>
                    </div>
                </div>
            </div>
            <div class="answer-buttons">
                <button id="incorrectBtn" class="button answer-button incorrect-button">✗ Incorrect</button>
                <button id="correctBtn" class="button answer-button correct-button">✓ Correct</button>
            </div>
        </div>

        <!-- RESULTS MODE -->
        <div id="resultsMode" class="mode-section">
            <div class="results-container">
                <h2 class="results-title">Results 🎯</h2>
                <div class="score-circle">
                    <div class="score-percentage" id="scorePercentage">0%</div>
                </div>
                <div class="result-stats">
                    <div class="result-box">
                        <div class="result-number correct-color" id="correctCount">0</div>
                        <div class="result-label">Correct</div>
                    </div>
                    <div class="result-box">
                        <div class="result-number incorrect-color" id="incorrectCount">0</div>
                        <div class="result-label">Incorrect</div>
                    </div>
                </div>
                <div id="chichvordingBox" class="chichvording-box" style="display: none;">
                    <div class="chichvording-text">📉 Keep Going!</div>
                    <div class="chichvording-subtext">Try to reach 90% next time</div>
                </div>
                <div id="celebrationBox" class="celebration-box" style="display: none;">
                    <div class="celebration-text">🎉 Perfect!</div>
                    <div class="celebration-subtext">You nailed it!</div>
                </div>
                <button id="restartButton" class="button restart-button"> Review</button>
                <button id="backButton" class="button back-button">Back</button>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">Made with Xojiakbar for learning</div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
